name: Tests

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/ctrain-mpl
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' torch==2.3.1 torchvision==0.18.1
          ctrain-install-git-deps --with-deps
          python -m pip check

      - name: Run CPU test suite
        run: python -m pytest -q
